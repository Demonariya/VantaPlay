[package]
name = "vlc-redesign"
version = "0.1.0"
description = "VLC Media Player, redesigned. A modern dark-first media player."
authors = ["Rishabh Bohra"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
