name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and build VantaPlay (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Type-check and build frontend
        run: npm run build

      - name: Build Tauri app and Windows installers
        run: npm run tauri build

      - name: Give the executable its product name
        shell: pwsh
        run: |
          $source = "src-tauri/target/release/vlc-redesign.exe"
          if (-not (Test-Path $source)) {
            throw "Expected Tauri executable was not found: $source"
          }
          Copy-Item $source "src-tauri/target/release/VantaPlay.exe" -Force

      - name: Upload Windows outputs
        uses: actions/upload-artifact@v4
        with:
          name: VantaPlay-Windows-x64
          path: |
            src-tauri/target/release/VantaPlay.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          compression-level: 6
