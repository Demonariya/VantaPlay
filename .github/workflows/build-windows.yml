name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and build VantaPlay (Windows x64)
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install VLC runtime for native playback
        shell: pwsh
        run: |
          choco install vlc -y --no-progress
          $vlcDir = Join-Path $env:ProgramFiles "VideoLAN\VLC"
          if (-not (Test-Path (Join-Path $vlcDir "libvlc.dll"))) {
            $libvlc = Get-ChildItem -Path $env:ProgramFiles -Filter "libvlc.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $libvlc) { throw "libvlc.dll was not found after installing VLC." }
            $vlcDir = $libvlc.Directory.FullName
          }
          $destination = "src-tauri/resources/vlc"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item (Join-Path $vlcDir "*.dll") $destination -Force
          Copy-Item (Join-Path $vlcDir "plugins") $destination -Recurse -Force
          Get-ChildItem $vlcDir -File | Where-Object { $_.Name -match '^(COPYING|README|AUTHORS|NEWS)' } | Copy-Item -Destination $destination -Force
          Set-Content -Path (Join-Path $destination "RUNTIME-NOTICE.txt") -Value "VantaPlay bundles the VideoLAN VLC runtime. See https://www.videolan.org/legal.html for license information."
          if (-not (Test-Path (Join-Path $destination "libvlc.dll"))) {
            throw "libvlc.dll was not copied to the VantaPlay resources folder."
          }
          Write-Host "Runtime files staged:"
          Get-ChildItem $destination -Force | Select-Object Name, Length, Mode | Format-Table -AutoSize

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Type-check and build frontend
        run: npm run build

      - name: Build Tauri app and Windows installers
        run: npm run tauri build

      - name: Give the executable its product name
        shell: pwsh
        run: |
          $source = "src-tauri/target/release/vlc-redesign.exe"
          if (-not (Test-Path $source)) {
            throw "Expected Tauri executable was not found: $source"
          }
          Copy-Item $source "src-tauri/target/release/VantaPlay.exe" -Force
          Copy-Item "src-tauri/resources/vlc" "src-tauri/target/release/vlc" -Recurse -Force

      - name: Upload Windows outputs
        uses: actions/upload-artifact@v4
        with:
          name: VantaPlay-Windows-x64
          path: |
            src-tauri/target/release/VantaPlay.exe
            src-tauri/target/release/vlc/**
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          compression-level: 6
