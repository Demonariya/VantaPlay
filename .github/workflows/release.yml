name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install VLC runtime for native playback
        shell: pwsh
        run: |
          choco install vlc -y --no-progress
          $vlcDir = Join-Path $env:ProgramFiles "VideoLAN\VLC"
          if (-not (Test-Path (Join-Path $vlcDir "libvlc.dll"))) {
            $libvlc = Get-ChildItem -Path $env:ProgramFiles -Filter "libvlc.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $libvlc) { throw "libvlc.dll was not found after installing VLC." }
            $vlcDir = $libvlc.Directory.FullName
          }
          $destination = "src-tauri/resources/vlc"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item (Join-Path $vlcDir "*.dll") $destination -Force
          Copy-Item (Join-Path $vlcDir "plugins") $destination -Recurse -Force
          Get-ChildItem $vlcDir -File | Where-Object { $_.Name -match '^(COPYING|README|AUTHORS|NEWS)' } | Copy-Item -Destination $destination -Force
          Set-Content -Path (Join-Path $destination "RUNTIME-NOTICE.txt") -Value "VantaPlay bundles the VideoLAN VLC runtime. See https://www.videolan.org/legal.html for license information."
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: tauri-apps/tauri-action@v0
        with:
          tagName: \${{ github.ref_name }}
          releaseName: "VantaPlay \${{ github.ref_name }}"
          releaseBody: "VantaPlay Windows desktop release. Review README.md for current implementation and licensing notes."
          releaseDraft: true
          prerelease: false
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
